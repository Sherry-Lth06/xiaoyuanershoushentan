<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>校园二手神探｜校园交易大厅</title>
<style>
:root{--ink:#17201b;--paper:#fff;--bg:#f7f8f2;--line:#17201b;--lime:#dfff72;--mint:#c9f7dc;--cream:#fff1c2;--pink:#ffcfe1;--lilac:#dfd3ff;--coral:#ff907e;--muted:#687169;--r:24px;--sm:12px;--pill:999px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}.wrap{width:min(1120px,calc(100% - 40px));margin:auto}.top{padding:28px 0 22px;background:var(--paper);border-bottom:1px solid var(--line)}.brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:23px}.logo{font-size:23px;font-weight:800}.logo i{font-style:normal;display:inline-grid;place-items:center;width:42px;height:42px;margin-right:9px;border:1px solid;border-radius:50%;background:var(--lime)}.mono{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.7px;text-transform:uppercase}.search{position:relative}.search svg{position:absolute;left:20px;top:50%;transform:translateY(-50%);width:23px}.search input{width:100%;height:62px;border:1px solid;border-radius:var(--pill);padding:0 58px;font-size:17px;outline:none}.search input:focus{box-shadow:0 0 0 4px var(--lilac)}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:24px 0}.tab{min-height:64px;border:1px solid;border-radius:var(--r);background:var(--paper);font-size:18px;font-weight:750}.tab.active{background:var(--ink);color:#fff;transform:translateY(-2px)}.tab span{display:block;font-size:12px;font-weight:500;margin-top:4px;opacity:.72}.bar{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:16px 0 22px}.bar h1{margin:0;font-size:clamp(34px,5vw,58px);letter-spacing:-1.8px;line-height:1}.bar p{margin:7px 0 0;color:var(--muted)}.count,.badge{border:1px solid;border-radius:var(--pill);padding:8px 13px;background:var(--cream);font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;padding-bottom:130px}.card{border:1px solid;border-radius:var(--r);background:var(--paper);padding:24px;display:flex;flex-direction:column;min-height:285px;animation:rise .25s both}.card:nth-child(3n+1){background:var(--cream)}.card:nth-child(3n+2){background:var(--mint)}.card:nth-child(3n){background:var(--pink)}@keyframes rise{from{opacity:0;transform:translateY(12px)}}.card-top,.card-foot{display:flex;align-items:center;justify-content:space-between;gap:12px}.card h2{font-size:24px;margin:20px 0 8px}.meta{font-size:14px;font-weight:700;margin-bottom:12px}.desc{line-height:1.65;margin:0 0 22px;flex:1}.card-foot{border-top:1px dashed;padding-top:15px}.author{font-size:14px;font-weight:650}.primary,.secondary,.contact,.fab,.empty-btn,.ai-btn{border:1px solid;border-radius:var(--pill);min-height:44px;padding:9px 18px;font-weight:750}.primary,.contact,.empty-btn{background:var(--ink);color:#fff}.secondary{background:var(--paper)}.fab-group{position:fixed;right:26px;bottom:25px;z-index:15;display:flex;flex-direction:column;align-items:flex-end;gap:10px}.fab{box-shadow:4px 4px 0 var(--ink);font-size:16px}.fab.sell{background:var(--coral)}.fab.buy{background:var(--lime)}.empty{grid-column:1/-1;text-align:center;border:1px dashed;border-radius:var(--r);background:var(--paper);padding:56px 20px}.illustration{font-size:74px;margin-bottom:13px}.empty h2{margin:0 auto 12px;font-size:25px;max-width:650px}.empty p{color:var(--muted);margin-bottom:22px}.modal{position:fixed;inset:0;z-index:30;background:rgba(23,32,27,.58);display:none;place-items:center;padding:20px}.modal.open{display:grid}.dialog{width:min(620px,100%);max-height:92vh;overflow:auto;border:1px solid;border-radius:30px;background:var(--paper);padding:28px;animation:pop .2s both}@keyframes pop{from{opacity:0;transform:scale(.96)}}.dialog.small{width:min(420px,100%);text-align:center;background:var(--lilac)}.dialog-head,.label-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.dialog h2{margin:0;font-size:28px}.dialog .intro{line-height:1.6;color:var(--muted)}.x{width:40px;height:40px;border:1px solid;border-radius:50%;background:var(--paper);font-size:20px}.field{margin:16px 0}.field label{display:block;font-weight:700;margin-bottom:8px}.field input,.field textarea,.field select{width:100%;border:1px solid;border-radius:var(--sm);background:var(--paper);padding:13px 14px;outline:none}.field textarea{min-height:120px;resize:vertical;line-height:1.6}.field input:focus,.field textarea:focus,.field select:focus{box-shadow:0 0 0 3px var(--lime)}.ai-btn{background:var(--lilac);padding:7px 12px;min-height:auto}.ai-panel{display:none;margin-top:10px;border:1px solid;border-radius:var(--sm);padding:14px;background:var(--cream)}.ai-panel.show{display:block}.ai-row{display:flex;gap:9px}.ai-row input{flex:1}.upload{border:1px dashed;border-radius:var(--sm);background:var(--bg);padding:18px;text-align:center}.upload input{border:0;padding:8px}.preview-name{font-size:13px;color:var(--muted);margin-top:8px}.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.wechat{font:700 23px ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid;border-radius:var(--sm);background:#fff;padding:17px;margin:18px 0}.toast{position:fixed;left:50%;bottom:28px;z-index:60;transform:translate(-50%,90px);opacity:0;background:var(--ink);color:#fff;padding:11px 20px;border-radius:var(--pill);transition:.25s}.toast.show{transform:translate(-50%,0);opacity:1}
@media(max-width:720px){.grid{grid-template-columns:1fr}.wrap{width:min(100% - 24px,1120px)}.brand .mono{display:none}.tabs{gap:8px}.tab{font-size:15px}.bar{align-items:flex-start;flex-direction:column}.fab-group{right:14px;bottom:14px}.dialog{padding:20px;border-radius:22px}.form-actions,.ai-row{flex-direction:column}.form-actions button,.ai-row button{width:100%}}
</style></head><body>
<header class="top"><div class="wrap"><div class="brand"><div class="logo"><i>🕵️</i>校园二手神探</div><div class="mono">Campus Exchange Hub</div></div><div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="search" type="search" placeholder="输入关键字，快速定位相关需求..." autocomplete="off"></div></div></header>
<main class="wrap"><nav class="tabs"><button class="tab active" data-tab="buy">我想买（需求大厅）<span>发布需求，让卖家主动找你</span></button><button class="tab" data-tab="sell">我想卖（闲置大厅）<span>发现校园里的高性价比好物</span></button></nav><section class="bar"><div><h1 id="hallTitle">需求大厅</h1><p id="hallSub">有需求就直说，也许隔壁寝室正好有。</p></div><span id="count" class="count">0 条信息</span></section><section id="list" class="grid" aria-live="polite"></section></main>
<div class="fab-group"><button id="openSell" class="fab sell">＋ 我要卖闲置</button><button id="openBuy" class="fab buy">＋ 我要发求购</button></div>
<div id="contactModal" class="modal"><div class="dialog small"><div class="dialog-head"><h2>联系这位同学 👋</h2><button class="x" data-close="contactModal">×</button></div><p>添加微信时记得备注“校园二手”。</p><div id="wechat" class="wechat"></div><button id="copyWx" class="primary">一键复制微信号</button></div></div>
<div id="sellModal" class="modal"><form id="sellForm" class="dialog"><div class="dialog-head"><h2>🎒 发布闲置</h2><button type="button" class="x" data-close="sellModal">×</button></div><p class="intro">把闲置写清楚、价格定合理，同校成交更快。</p><div class="field"><label for="sellName">物品名称</label><input id="sellName" required placeholder="例如：iPad Air 4 64G"></div><div class="field"><label for="sellPrice">价格</label><input id="sellPrice" required placeholder="例如：1800 元"></div><div class="field"><label for="sellCondition">新旧程度</label><select id="sellCondition"><option>全新未拆</option><option>九成新</option><option selected>八成新</option><option>正常使用痕迹</option></select></div><div class="field"><label>图片上传（模拟）</label><div class="upload">📷 选择物品图片<input id="sellImage" type="file" accept="image/*"><div id="imageName" class="preview-name">暂未选择图片</div></div></div><div class="field"><div class="label-row"><label for="sellDesc">卖点文案</label><button id="sellAiToggle" class="ai-btn" type="button">✨ AI 生成卖点</button></div><textarea id="sellDesc" required placeholder="描述功能、配件、瑕疵和交易地点..."></textarea><div id="sellAiPanel" class="ai-panel"><label for="sellKeyword">告诉 AI 物品亮点</label><div class="ai-row"><input id="sellKeyword" placeholder="例如：功能全好，送保护壳"><button id="sellAiRun" class="primary" type="button">生成卖点</button></div></div></div><div class="field"><label for="sellNick">发布者昵称</label><input id="sellNick" required placeholder="例如：毕业搬家中"></div><div class="field"><label for="sellWx">微信号</label><input id="sellWx" required placeholder="点击联系时展示"></div><div class="form-actions"><button type="button" class="secondary" data-close="sellModal">取消</button><button class="primary" type="submit">确认发布闲置</button></div></form></div>
<div id="buyModal" class="modal"><form id="buyForm" class="dialog"><div class="dialog-head"><h2>🔎 发布求购</h2><button type="button" class="x" data-close="buyModal">×</button></div><p class="intro">告诉 AI 你想买什么，它帮你写一段诚恳的求购信息。</p><div class="field"><label for="buyName">求购物品</label><input id="buyName" required placeholder="例如：二手 iPad Air 4"></div><div class="field"><label for="buyBudget">预算范围</label><input id="buyBudget" required placeholder="例如：500-800元"></div><div class="field"><label for="buyCondition">期望成色</label><select id="buyCondition"><option>全新</option><option selected>9成新即可</option><option>8成新即可</option><option>功能正常即可</option></select></div><div class="field"><div class="label-row"><label for="buyDesc">求购说明</label><button id="buyAiToggle" class="ai-btn" type="button">✨ AI 生成求购文案</button></div><textarea id="buyDesc" required placeholder="描述型号、用途、可接受瑕疵和交易地点..."></textarea><div id="buyAiPanel" class="ai-panel"><label for="buyKeyword">告诉 AI 你想买什么</label><div class="ai-row"><input id="buyKeyword" placeholder="例如：买个二手iPad"><button id="buyAiRun" class="primary" type="button">生成求购</button></div></div></div><div class="field"><label for="buyNick">发布者昵称</label><input id="buyNick" required placeholder="例如：考研摸鱼选手"></div><div class="field"><label for="buyWx">微信号</label><input id="buyWx" required placeholder="点击联系时展示"></div><div class="form-actions"><button type="button" class="secondary" data-close="buyModal">取消</button><button class="primary" type="submit">确认发布求购</button></div></form></div>
<div id="toast" class="toast" role="status"></div>
<script>
const sellList=[{name:'iPad Air 4 深空灰 64G',price:'¥1800',condition:'八成新',desc:'功能全好，屏幕左上角有一道小划痕，送保护壳和充电器，可当面验机。',author:'数码断舍离',wx:'ipad_air404',time:'28分钟前',image:'已上传实拍图'},{name:'九成新加厚棉服',price:'¥45',condition:'九成新',desc:'黑色 L 码，已清洗，图书馆久坐很暖，价格可小刀。',author:'衣柜爆仓了',wx:'coat_45',time:'50分钟前',image:'已上传实拍图'}];
const buyList=[{name:'iPad Air 4 64G',budget:'¥1600–1800',condition:'八成新即可',desc:'学生党自用，功能正常即可，小磕碰不介意，最好能在东区食堂当面验机。',author:'考研摸鱼选手',wx:'study_2048',time:'刚刚'},{name:'图书馆厚外套',budget:'¥30–50',condition:'八成新即可',desc:'M/L 码都可以，深色耐脏优先，保暖就行，不挑牌子。',author:'早八幸存者',wx:'warm_050',time:'12分钟前'}];
let current='buy',activeWx='';const $=s=>document.querySelector(s),list=$('#list'),search=$('#search'),toast=$('#toast');
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function render(){const source=current==='buy'?buyList:sellList,q=search.value.trim().toLowerCase(),rows=source.filter(x=>(x.name+' '+x.desc).toLowerCase().includes(q));$('#count').textContent=rows.length+' 条信息';if(!rows.length){list.innerHTML=`<div class="empty"><div class="illustration">${current==='buy'?'🧑‍🎓🔭':'🎒🌱'}</div><h2>${current==='buy'?'哎呀，暂时没找到合适的卖家。不如先发个需求帖，让卖家主动来找你？':'暂时没有匹配的闲置，换个关键词看看吧！'}</h2><p>${q?'当前关键词没有匹配结果。':'成为第一个发布信息的同学吧。'}</p>${current==='buy'?'<button class="empty-btn" id="emptyBuy">立即发布求购</button>':''}</div>`;if($('#emptyBuy'))$('#emptyBuy').onclick=()=>openModal('buyModal');return}list.innerHTML=rows.map((x,i)=>`<article class="card" style="animation-delay:${i*45}ms"><div class="card-top"><span class="badge">${current==='buy'?'🔎 求购':'🎒 闲置'}</span><span class="mono">${esc(x.time)}</span></div><h2>${esc(x.name)}</h2><div class="meta">${current==='buy'?'预算范围：'+esc(x.budget)+' · 期望成色：'+esc(x.condition):'价格：'+esc(x.price)+' · 新旧程度：'+esc(x.condition)}</div><p class="desc">${esc(x.desc)}</p><div class="card-foot"><span class="author">@${esc(x.author)}</span><button class="contact" data-wx="${esc(x.wx)}">联系 TA</button></div></article>`).join('');document.querySelectorAll('.contact').forEach(b=>b.onclick=()=>openContact(b.dataset.wx))}
function switchTab(t){current=t;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));$('#hallTitle').textContent=t==='buy'?'需求大厅':'闲置大厅';$('#hallSub').textContent=t==='buy'?'有需求就直说，也许隔壁寝室正好有。':'让闲置流动起来，把实惠留在校园。';render()}
function openModal(id){$('#'+id).classList.add('open')}function closeModal(id){$('#'+id).classList.remove('open')}function openContact(wx){activeWx=wx;$('#wechat').textContent=wx;openModal('contactModal')}function showToast(t){toast.textContent=t;toast.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>toast.classList.remove('show'),1800)}
async function copyText(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}showToast('微信号已复制')}
function toggle(id){$('#'+id).classList.toggle('show')}function sellCopy(k,n){return `回血出一件${n||'校园闲置'}！${k||'自用保存不错，功能状态良好'}。真实情况已如实说明，支持校园内当面确认，价格诚心，爽快的同学优先～`}function buyCopy(k,n){return `诚心求购${n||k}，学生党自用，${k||'希望功能正常、成色合适'}。预算合理，可接受正常使用痕迹，支持校园内当面检查，合适的话可以爽快交易，欢迎带价联系～`}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));search.oninput=render;$('#openSell').onclick=()=>openModal('sellModal');$('#openBuy').onclick=()=>openModal('buyModal');document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeModal(b.dataset.close));document.querySelectorAll('.modal').forEach(m=>m.onclick=e=>{if(e.target===m)closeModal(m.id)});$('#copyWx').onclick=()=>copyText(activeWx);$('#sellAiToggle').onclick=()=>toggle('sellAiPanel');$('#buyAiToggle').onclick=()=>toggle('buyAiPanel');
$('#sellAiRun').onclick=()=>{$('#sellDesc').value=sellCopy($('#sellKeyword').value.trim(),$('#sellName').value.trim());showToast('卖点文案已生成')};$('#buyAiRun').onclick=()=>{$('#buyDesc').value=buyCopy($('#buyKeyword').value.trim(),$('#buyName').value.trim());showToast('求购文案已生成')};$('#sellImage').onchange=e=>{$('#imageName').textContent=e.target.files[0]?'已选择：'+e.target.files[0].name:'暂未选择图片'};
$('#sellForm').onsubmit=e=>{e.preventDefault();sellList.unshift({name:$('#sellName').value.trim(),price:$('#sellPrice').value.trim(),condition:$('#sellCondition').value,desc:$('#sellDesc').value.trim(),author:$('#sellNick').value.trim(),wx:$('#sellWx').value.trim(),time:'刚刚',image:$('#sellImage').files[0]?'已上传模拟图片':'未上传图片'});e.target.reset();$('#imageName').textContent='暂未选择图片';$('#sellAiPanel').classList.remove('show');search.value='';closeModal('sellModal');switchTab('sell');showToast('闲置发布成功，已置顶')};
$('#buyForm').onsubmit=e=>{e.preventDefault();buyList.unshift({name:$('#buyName').value.trim(),budget:$('#buyBudget').value.trim(),condition:$('#buyCondition').value,desc:$('#buyDesc').value.trim(),author:$('#buyNick').value.trim(),wx:$('#buyWx').value.trim(),time:'刚刚'});e.target.reset();$('#buyAiPanel').classList.remove('show');search.value='';closeModal('buyModal');switchTab('buy');showToast('求购发布成功，已置顶')};document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal.open').forEach(m=>closeModal(m.id))});render();
</script></body></html>
